<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

const params = new URLSearchParams(location.search);
const BUST = '?v=final-20261110';
const INTERIOR = ['verde','borovskeho'].includes(params.get('interior')) ? params.get('interior') : null;
const MODEL = params.get('model') || 'so05-glb.webm';
const PROHLIDKA = params.get('prohlidka') || '../prohlidka-byt/';     // 3D prohlídka typového bytu (podsložka Petrovy stránky)
const DOTYK = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
if (DOTYK) document.body.classList.add('dotyk');
if (params.get('bezui') === '1') document.body.classList.add('bezui');
const canvas = document.getElementById('scena');
const nac = document.getElementById('nacitani');
const nacText = document.getElementById('nacitaniText');
const lista = document.getElementById('lista');
const DEG = Math.PI / 180;

function chyba(msg) {
  nac.classList.remove('skryt'); nac.classList.add('chyba');
  nacText.textContent = msg; lista.parentElement.classList.add('skryt');
}

// ---------------------------------------------------------------- souřadnice
// místní rám scena.json: X = východ, Y = sever mřížky S-JTSK (m); svět prohlížeče = (X, výška, −Y); ±0,00 domu = 0
const ZEM_Y = -0.17;
const OSA_U = [-0.345832, 0.938297], OSA_V = [-0.938297, -0.345832];       // osy domu SO 05 (u podél domu, v k ZJZ)
const KONV = 8.134;                    // sever mřížky S-JTSK je u Slaného o 8,1° vlevo od skutečného severu (pyproj, EPSG:5514 → 4326)
const SEVER = new THREE.Vector3(Math.sin(KONV * DEG), 0, -Math.cos(KONV * DEG));
const VYCHOD = new THREE.Vector3(Math.cos(KONV * DEG), 0, Math.sin(KONV * DEG));
const xyW = (X, Y, h = 0) => new THREE.Vector3(X, h, -Y);
const uvW = (u, v, h = 0) => xyW(u * OSA_U[0] + v * OSA_V[0], u * OSA_U[1] + v * OSA_V[1], h);
const U_W = new THREE.Vector3(OSA_U[0], 0, -OSA_U[1]), V_W = new THREE.Vector3(OSA_V[0], 0, -OSA_V[1]);
const rotNa = (n) => Math.atan2(n.x, n.z);                                 // rotace kolem Y, aby +Z rovina hleděla směrem n

// ---------------------------------------------------------------- renderer, kamera
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
} catch (e) {
  chyba('Tento prohlížeč nepodporuje 3D zobrazení (WebGL). Zkuste prosím jiný prohlížeč.');
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
